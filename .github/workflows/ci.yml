name: lifecycle-policy-review
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Source tests and build
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONPATH=src python -m unittest discover -s tests -v
          ruff check src tests scripts
          ruff format --check src tests scripts
          python -m build --no-isolation
      - name: Fresh offline consumer and artifacts
        run: |
          python -m venv .install-check
          .install-check/bin/python -m pip install --no-index --no-deps dist/lifecycle_policy_review-0.1.3-py3-none-any.whl
          .install-check/bin/python -m pip check
          consumer="$PWD/.install-check/bin/python"
          project="$PWD"
          cd "$RUNNER_TEMP"
          "$consumer" -I -m unittest discover -s "$project/tests" -v
          "$consumer" -I "$project/scripts/installed_cli_check.py"
          installed_dir=$("$consumer" -I -c 'import pathlib,lifecycle_policy_review; print(pathlib.Path(lifecycle_policy_review.__file__).parent.parent)')
          "$consumer" -I "$project/scripts/verify_package.py" "$project" --installed "$installed_dir"
