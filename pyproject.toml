[build-system]
requires = ["setuptools==82.0.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "dhtfish98"}]
maintainers = [{name = "dhtfish98"}]
name = "lifecycle-policy-review"
version = "0.1.1"
description = "Offline exact-instance install lifecycle policy and stale-approval review"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
dependencies = []

[project.scripts]
lifecycle-policy-review = "lifecycle_policy_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lifecycle_policy_review = ["py.typed"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLW1510"]
